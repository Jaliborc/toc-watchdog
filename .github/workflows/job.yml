name: Monitor WoW Updates

on:
  schedule:
    - cron: '0 11-23 * * *' # Runs every hour during the day
  workflow_dispatch: # Allows manual triggers from GitHub UI

jobs:
  run-task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm and Node
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Restore state.json
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: persistent-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            persistent-state-${{ runner.os }}-

      - name: Run watchdog
        run: node main.js

      - name: Save state.json
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: persistent-state-${{ runner.os }}-${{ github.run_id }}